[project]
name = "terrarium"
version = "0.1.0"
description = "Neighbourhood-scale digital twin for simulating climate interventions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # --- API layer ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- State Cube: geospatial ingest + array storage ---
    "xarray>=2024.10",
    "odc-stac>=0.3.10",
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "rioxarray>=0.17",
    # Imported directly by state/grid.py and ingest/client.py, not just transitively.
    "odc-geo>=0.4",
    "pyproj>=3.6",
    # Imported directly for its Resampling enum: ingest/pipeline.py needs `sum` for the
    # extensive population raster, and scripts/preview_cube.py needs the enum too. Pulled
    # in transitively by rioxarray, but we name it because we import it.
    "rasterio>=1.3",
    "zarr>=2.18,<3",
    "duckdb>=1.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    # --- Physics Core: thermal emulator ---
    "lightgbm>=4.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    # Imported directly by cores/thermal/features.py for the neighbourhood filter, not
    # just pulled in transitively by scikit-learn.
    "scipy>=1.14",
    "numba>=0.66.0",
    # --- Intelligence: the plain-language narrator (D17 reopened, D24) ---
    # LangChain rather than the hand-rolled urllib adapters that sit beside it in
    # dsl/llm.py. Both providers stay free-tier and keyless-by-default, so the zero-budget
    # rule is intact; what this buys is one prompt and one output parser across two
    # providers instead of two hand-written request shapes. `langchain-core` is imported
    # directly for ChatPromptTemplate and StrOutputParser, not just pulled in.
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "langchain-google-genai>=2.0",
]
    
[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",          # FastAPI TestClient transport
    "ruff>=0.7",
    "mypy>=1.13",
    # Visual sanity-check renders only (scripts/preview_cube.py). Not imported by the
    # package itself, so it stays out of the runtime dependency set.
    "matplotlib>=3.9",
]

[project.scripts]
terrarium-api = "terrarium.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terrarium"]
# Tests live beside the modules they cover; keep them out of the built wheel.
exclude = ["**/test_*.py", "**/conftest.py"]

# ---------------------------------------------------------------- tooling ---

[tool.pytest.ini_options]
testpaths = ["src/terrarium", "scripts"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = ["ANN401"]  # allow typing.Any where genuinely needed

[tool.ruff.lint.per-file-ignores]
# Test functions need no return annotations, and test doubles mirror the untyped
# third-party signatures they stand in for.
"**/test_*.py" = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202"]
"scripts/*.py" = ["ANN001"]
# The Urdu half of the rule parser (Phase 11) is written in Urdu: its patterns, its
# examples and the sentence it refuses with all contain Arabic script and Eastern
# Arabic-Indic digits. RUF001-003 flag those as characters that "look like" ASCII, which
# is the right warning for a stray Cyrillic 'а' in an English identifier and the wrong one
# for text that is deliberately not English.
"src/terrarium/dsl/planner.py" = ["RUF001", "RUF002", "RUF003"]
"src/terrarium/dsl/test_planner.py" = ["RUF001", "RUF002", "RUF003"]
"src/terrarium/dsl/observe.py" = ["RUF002"]

[tool.mypy]
python_version = "3.12"
packages = ["terrarium"]
mypy_path = "src"
strict = true
# Geospatial stack ships incomplete stubs; don't fail the build on them.
[[tool.mypy.overrides]]
module = [
    "odc.*",
    "pystac.*",
    "pystac_client.*",
    "planetary_computer.*",
    "lightgbm.*",
    "rioxarray.*",
    "pyproj.*",
    "pandas.*",
    "scipy.*",
    "rasterio.*",
    # Imported directly by api/geometry.py for the GeoJSON -> mask conversion.
    "shapely.*",
]
ignore_missing_imports = true

# dask ships a partial py.typed: `delayed` is re-exported implicitly and `from_delayed`
# is unannotated, so strict mode rejects both despite the stubs being present.
[[tool.mypy.overrides]]
module = ["dask", "dask.*"]
ignore_missing_imports = true
implicit_reexport = true
follow_imports = "skip"
